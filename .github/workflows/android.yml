name: Open Makeup Android APK

on:
  push:
    branches: [main, feat/android-app, feat/open-makeup-android6-about]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies and synchronize the existing lockfile
        run: npm install

      - name: Type-check SDK
        run: npm run typecheck

      - name: Test runtime reliability and SDK error propagation
        run: npm test

      - name: Bundle web engine and local runtime assets
        run: npm run build

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Makeup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
