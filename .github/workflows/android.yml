name: Open Makeup Android APK

on:
  push:
    branches: [main, feat/android-app, feat/open-makeup-android6-about]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies and synchronize the existing lockfile
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check SDK
        run: npm run typecheck

      - name: Test runtime reliability and SDK error propagation
        run: npm test

      - name: Bundle web engine and local runtime assets
        run: npm run build

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon -p android assembleDebug assembleRelease

      - name: Verify release metadata and checksum APKs
        run: |
          grep -q "versionCode 6" android/app/build.gradle
          grep -q "versionName '1.5.0'" android/app/build.gradle
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk > android/app/build/outputs/apk/APK-SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Makeup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release candidate and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Open-Makeup-release-candidate
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/APK-SHA256SUMS.txt
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
