plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magd.openmakeup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magd.openmakeup'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
